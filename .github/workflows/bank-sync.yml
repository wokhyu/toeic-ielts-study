name: bank-sync

# Loads the TOEIC/IELTS practice questions (content/bank/**) and the roadmap
# tasks (content/roadmap/**) into Supabase. Mock tests are not in the repo and
# are imported from a maintainer's machine. Also runs after a successful
# db-migrate, so content needing a new table or function is loaded right away.
on:
  push:
    branches: [main]
    paths:
      - 'content/bank/**'
      - 'content/roadmap/**'
      - 'scripts/import-bank.ts'
      - 'scripts/bank-content.ts'
      - 'src/content/bank-schema.ts'
      - 'src/content/bank-check.ts'
  workflow_run:
    workflows: [db-migrate]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bank-sync
  cancel-in-progress: false

jobs:
  import:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Set VITE_SUPABASE_URL (repo) and SUPABASE_SERVICE_ROLE_KEY (environment 'production'). See README."
            exit 1
          fi

      - name: Import question banks
        run: npm run import:bank
