<!doctype html>
<html lang="vi" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Website học nhóm: lộ trình TOEIC, IELTS và ôn tập Toán Lý Hóa 11." />
    <meta name="theme-color" content="#fbf7f0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><ellipse cx='32' cy='36' rx='22' ry='24' fill='%230f766e'/><ellipse cx='32' cy='42' rx='13' ry='14' fill='%23fbf7f0'/><circle cx='23' cy='28' r='8' fill='white'/><circle cx='41' cy='28' r='8' fill='white'/><circle cx='24' cy='29' r='4' fill='%231f2a37'/><circle cx='40' cy='29' r='4' fill='%231f2a37'/><path d='M29 36 L35 36 L32 41 Z' fill='%23f97362'/></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@300..700&display=swap"
    />
    <title>Học nhóm</title>
    <script>
      // Same rule as src/lib/theme.ts, applied before React loads so the page never flashes.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('theme');
        } catch (e) {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
